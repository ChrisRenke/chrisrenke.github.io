# One entry per project, newest first.
# image: path under /assets/projects/ (credit-card shaped, ~856x540 works well)
# date and blurb are optional; blurbs have room for about 50-80 words.
- title: 7 Wonders Score Sheet
  url: https://chrisrenke.com/
  image: /assets/projects/7-wonders.png
  # date:
  blurb: >-
    Score your 7 Wonders games and see how you really play. Science and Money
    work out their own points, places and medals are settled for you, and every
    game is saved. The stats build up from there: wins, podiums, streaks and
    personal bests for every player and every Wonder. It covers both editions
    and every expansion, and turns the results into a scorecard you can send
    to the group chat.

- title: Baby Schedule
  url: https://chrisrenke.com/baby-schedule
  image: /assets/projects/baby-schedule.webp
  # date:
  blurb: >-
    A visual version of the newborn schedules from the book Moms on Call. Instead
    of a flat list of times, the day is laid out as yesterday, today and
    tomorrow, so you can see night sleep wrap past midnight and the evening run
    into the morning. Switch between the 2-week and 6-month schedules, tap any
    block for the book's own wording, or draw a custom day. Installs as an
    offline app.

- title: ELOquence
  url: https://chrisrenke.com/ELOquence
  image: /assets/projects/eloquence.webp
  # date:
  blurb: >-
    Rank anything by choosing between two options at a time. Paste in a list of
    baby names, vacation spots or pizza toppings and ELOquence shows you pairs,
    then builds a ranking with the same rating system used in chess. When it
    isn't a clear winner there are "both are great" and "both are meh" buttons.
    Your lists save in the browser, and rankings export to CSV.
