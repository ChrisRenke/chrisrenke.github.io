<div id="projects">
  <ul class="posts projects">
    {% for project in site.data.projects %}
      <li>
        <a class="hero" href="{{ project.url }}">
          {% if project.image %}<img src="{{ project.image }}" alt="{{ project.title }}">{% endif %}
        </a>
        <div class="project-text">
          <a class="project-title" href="{{ project.url }}">{{ project.title }}</a>
          {% if project.date %}<span class="project-date">{{ project.date | date_to_string }}</span>{% endif %}
          {% if project.blurb %}<div class="project-blurb">{{ project.blurb | markdownify }}</div>{% endif %}
        </div>
      </li>
    {% endfor %}
  </ul>
</div>
